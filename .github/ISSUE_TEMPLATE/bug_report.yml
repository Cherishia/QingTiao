name: 使用问题反馈
description: 报告漏跳、误点、安装或其他异常。
body:
  - type: input
    id: versions
    attributes:
      label: 轻跳版本和 Android 版本
      placeholder: 轻跳 0.5.40，Android 15
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 手机型号和涉及的应用
      description: 如果知道包名，也可一同填写。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 按顺序写出打开的应用、出现问题的界面以及所做的操作。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 实际结果和预期结果
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 相关识别记录
      description: 可从轻跳首页的「抓取记录」复制相关片段，提交前请移除个人信息。
      render: text
